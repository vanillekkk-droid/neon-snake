
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<link rel="manifest" href="/neon-snake/manifest.json">
<title>Neon Snake Arcade</title>
<style>
:root{--n:#00ff9c;--bg:#080d18;--p:#111b2d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at top,#172b40,var(--bg) 72%);color:#f3f7ff;font-family:system-ui,Arial,sans-serif}
#app{height:100vh;height:100dvh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden}
header{text-align:center;flex:none}
h1{margin:2px;color:var(--n);font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.1;text-shadow:0 0 18px #00ff9c70}
.sub{margin:2px;color:#9aabc3;font-size:.6rem;letter-spacing:1px}
.stats{width:100%;max-width:430px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.panel{background:var(--p);border:1px solid #293d54;border-radius:10px;padding:4px;text-align:center}
.label{color:#9aabc3;font-size:.62rem}
.val{color:var(--n);font-size:1.2rem;font-weight:800}
.board{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{width:min(100%,calc(100dvh - 300px),430px);height:auto;max-height:100%;aspect-ratio:1;border:2px solid var(--n);border-radius:12px;background:#060b13;touch-action:none}
#message{flex:none;min-height:22px;text-align:center;font-size:.75rem;color:#cfdbec}
.actions{width:100%;max-width:430px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
button{border:1px solid #38516b;border-radius:9px;background:#18283c;color:white;font-size:.82rem;font-weight:700;padding:9px 3px;touch-action:manipulation;user-select:none}
button.primary{background:var(--n);color:#06140e}
.controls{flex:none;width:min(100%,390px);height:clamp(135px,25dvh,195px);min-height:125px;margin:0 auto 3px;padding:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1.25fr 1fr;gap:4px;background:#0a1724;border:1px solid #174354;border-radius:17px;touch-action:none}
.controls button{min-width:0;min-height:0;padding:0;border:0;border-radius:0;font-size:clamp(1.6rem,8vw,2.4rem);color:#6bffd0;background:linear-gradient(145deg,#12483f,#102536);box-shadow:inset 0 0 0 2px #00ff9c85;touch-action:none}
.controls button:active{background:var(--n);color:#06140e}
[data-dir=up]{grid-column:1/4;grid-row:1;clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}
[data-dir=left]{grid-column:1;grid-row:2;clip-path:polygon(0 0,100% 22%,100% 78%,0 100%)}
#pause{grid-column:2;grid-row:2;clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%);background:#12365b;color:#d7f5ff;box-shadow:inset 0 0 0 2px #48cfff}
[data-dir=right]{grid-column:3;grid-row:2;clip-path:polygon(0 22%,100% 0,100% 100%,0 78%)}
[data-dir=down]{grid-column:1/4;grid-row:3;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
#menu{position:fixed;inset:0;z-index:5;background:#050912ed;display:flex;align-items:center;justify-content:center;padding:18px}
.hidden{display:none!important}
.dialog{width:100%;max-width:420px;max-height:85dvh;overflow:auto;background:var(--p);border:1px solid var(--n);border-radius:16px;padding:18px}
.dialog h2{text-align:center;color:var(--n);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{padding:15px 5px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #293d54;font-size:.85rem}
.skin{margin:4px;padding:10px;text-align:left}
.small{font-size:.8rem;color:#9aabc3}
@media(max-height:650px){
 #app{gap:3px}
 h1{font-size:1.45rem}
 .sub{font-size:.55rem}
 .controls{height:clamp(115px,23dvh,150px);min-height:110px}
 canvas{width:min(100%,calc(100dvh - 250px),360px)}
 .val{font-size:1rem}
}
</style>
</head>
<body>
<div id="app">
<header><h1>🐍 Neon Snake</h1><div class="sub">ARCADE EDITION · EAT · COLLECT · UNLOCK</div></header>
<div class="stats">
 <div class="panel"><div class="label">PUNKTE</div><div class="val" id="score">0</div></div>
 <div class="panel"><div class="label">🪙 MÜNZEN</div><div class="val" id="coins">0</div></div>
 <div class="panel"><div class="label">REKORD</div><div class="val" id="best">0</div></div>
</div>
<div class="board"><canvas id="game" width="360" height="360"></canvas></div>
<div id="message">Tippe auf Spielen oder eine Richtungstaste.</div>
<div class="actions">
 <button class="primary" id="start">▶ Spielen</button>
 <button id="sound">🔊 Sound: An</button>
 <button id="menuBtn">☰ Menü</button>
</div>
<div class="controls">
 <button data-dir="up" aria-label="Oben">⬆️</button>
 <button data-dir="left" aria-label="Links">⬅️</button>
 <button id="pause" aria-label="Start oder Pause">▶</button>
 <button data-dir="right" aria-label="Rechts">➡️</button>
 <button data-dir="down" aria-label="Unten">⬇️</button>
</div>
</div>

<div id="menu" class="hidden">
<div class="dialog">
<h2 id="title">🐍 Neon Snake</h2>
<div id="content"></div>
<div style="margin-top:12px;display:flex;gap:8px">
<button id="back" class="hidden">← Zurück</button>
<button id="close" class="primary">Schließen</button>
</div>
</div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const N=18,CELL=20;
const skins=[
{id:"green",name:"Neon Grün",color:"#00ff9c",price:0},
{id:"blue",name:"Cyber Blau",color:"#36a3ff",price:15},
{id:"purple",name:"Laser Lila",color:"#c56bff",price:30},
{id:"gold",name:"Gold Rush",color:"#ffd34d",price:50},
{id:"pink",name:"Hot Pink",color:"#ff4fc8",price:80},
{id:"ice",name:"Eis Kristall",color:"#b7f5ff",price:120}
];
const getNum=(key)=>Math.max(0,Number(localStorage.getItem(key))||0);
let coins=0,best=0,totalApples=0,totalRounds=0;
let owned=["green"],selected="green",scores=[];
let snake=[],food,coin,dir={x:1,y:0},nextDir={x:1,y:0};
let score=0,running=false,paused=false,soundOn=true,timer=null,audio=null,saved=false;

function load(){
 try{
  coins=getNum("nsa_coins");best=getNum("neonSnakeHighscore");
  totalApples=getNum("nsa_apples");totalRounds=getNum("nsa_rounds");
  const o=JSON.parse(localStorage.getItem("nsa_owned")||'["green"]');
  if(Array.isArray(o))owned=[...new Set(["green",...o.filter(x=>skins.some(s=>s.id===x))])];
  const s=localStorage.getItem("nsa_selected");if(owned.includes(s))selected=s;
  const l=JSON.parse(localStorage.getItem("neonSnakeScores")||"[]");
  if(Array.isArray(l))scores=l.filter(x=>x&&Number.isFinite(x.score)&&x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
  if(scores.length)best=Math.max(best,scores[0].score);
 }catch(e){}
}
function save(){
 try{
  localStorage.setItem("nsa_coins",coins);
  localStorage.setItem("neonSnakeHighscore",best);
  localStorage.setItem("nsa_apples",totalApples);
  localStorage.setItem("nsa_rounds",totalRounds);
  localStorage.setItem("nsa_owned",JSON.stringify(owned));
  localStorage.setItem("nsa_selected",selected);
  localStorage.setItem("neonSnakeScores",JSON.stringify(scores));
 }catch(e){}
}
function tone(freq=600,duration=.1){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audio)audio=new AC();if(audio.state==="suspended")audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=freq;g.gain.value=.06;o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}
function update(){
 $("score").textContent=score;$("coins").textContent=coins;$("best").textContent=best;
 $("pause").textContent=running?"Ⅱ":"▶";
}
function randomSpot(){
 let p,tries=0;
 do{
  p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};tries++;
 }while(tries<500&&(snake.some(s=>s.x===p.x&&s.y===p.y)||(food&&p.x===food.x&&p.y===food.y)||(coin&&p.x===coin.x&&p.y===coin.y)));
 return p;
}
function reset(first="right"){
 const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[first]||{x:1,y:0};
 dir={...d};nextDir={...d};score=0;saved=false;
 const h={x:8,y:9};snake=[h,{x:h.x-d.x,y:h.y-d.y},{x:h.x-2*d.x,y:h.y-2*d.y}];
 food=randomSpot();coin=randomSpot();update();draw();
}
function draw(){
 ctx.fillStyle="#060b13";ctx.fillRect(0,0,360,360);
 ctx.strokeStyle="#142234";ctx.lineWidth=.5;
 for(let i=0;i<=N;i++){
  ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,360);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(360,i*CELL);ctx.stroke();
 }
 ctx.fillStyle="#ff3864";ctx.shadowColor="#ff3864";ctx.shadowBlur=12;
 ctx.beginPath();ctx.arc(food.x*CELL+10,food.y*CELL+10,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ffd34d";ctx.shadowColor="#ffd34d";
 ctx.beginPath();ctx.arc(coin.x*CELL+10,coin.y*CELL+10,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 const skin=skins.find(s=>s.id===selected)||skins[0];
 snake.forEach((p,i)=>{ctx.fillStyle=i===0?"#fff":skin.color;ctx.fillRect(p.x*CELL+2,p.y*CELL+2,16,16)});
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function start(first="right"){
 if(running)return;
 stop();reset(first);paused=false;running=true;
 $("menu").classList.add("hidden");$("message").textContent="Los geht's! Sammle Äpfel und Münzen.";
 $("start").textContent="↻ Neustart";update();timer=setInterval(tick,125);
}
function finish(){
 running=false;paused=false;stop();
 if(!saved){
  totalRounds++;
  if(score>0){scores.push({score,date:new Date().toLocaleDateString("de-DE")});scores.sort((a,b)=>b.score-a.score);scores=scores.slice(0,5)}
  best=Math.max(best,score);saved=true;save();
 }
 update();draw();$("message").textContent="Game Over! "+score+" Punkte.";
 openMenu("💥 Game Over",`<p>Punkte: ${score} · Rekord: ${best}</p><button id="again" class="primary">↻ Nochmal spielen</button>`);
 $("again").onclick=()=>start();
}
function tick(){
 dir=nextDir;
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 const eat=h.x===food.x&&h.y===food.y,collect=h.x===coin.x&&h.y===coin.y;
 if(h.x<0||h.x>=N||h.y<0||h.y>=N){finish();return}
 const body=(eat||collect)?snake:snake.slice(0,-1);
 if(body.some(p=>p.x===h.x&&p.y===h.y)){finish();return}
 snake.unshift(h);
 if(eat){score+=10;totalApples++;best=Math.max(best,score);food=randomSpot();tone(660);$("message").textContent="+10 Punkte!"}
 if(collect){coins+=5;coin=randomSpot();tone(950);$("message").textContent="🪙 +5 Münzen!"}
 if(!eat&&!collect)snake.pop();
 update();draw();if(eat||collect)save();
}
function changeDirection(name){
 const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];
 if(!d||d.x===-dir.x&&d.y===-dir.y)return;
 nextDir=d;
}
function resumeDirection(name){
 if(!running&&!paused){start(name);return}
 if(paused){
  changeDirection(name);paused=false;running=true;$("menu").classList.add("hidden");
  $("message").textContent="Weiter geht's!";timer=setInterval(tick,125);update();return;
 }
 changeDirection(name);
}
function togglePause(){
 if(running){
  running=false;paused=true;stop();
  openMenu("⏸ Pause",'<p>Dein Spiel ist pausiert.</p><button id="resume" class="primary">▶ Weiter</button>');
  $("resume").onclick=()=>{paused=false;running=true;$("menu").classList.add("hidden");timer=setInterval(tick,125);update()};
 }else if(paused){
  paused=false;running=true;$("menu").classList.add("hidden");timer=setInterval(tick,125);
 }else start();
 update();
}
function openMenu(title,html){
 $("title").textContent=title;$("content").innerHTML=html;
 $("menu").classList.remove("hidden");$("back").classList.add("hidden");
}
function homeMenu(){
 openMenu("🐍 Neon Snake",'<p class="small">Wähle einen Bereich.</p><div class="grid"><button id="shopBtn">🎨 Skin-Shop</button><button id="scoresBtn">🏆 Top 5</button><button id="statsBtn">📊 Statistik</button><button id="continue">🎮 Zurück zum Spiel</button></div>');
 $("shopBtn").onclick=showShop;$("scoresBtn").onclick=showScores;$("statsBtn").onclick=showStats;
 $("continue").onclick=()=>$("menu").classList.add("hidden");
}
function showShop(){
 $("title").textContent="🎨 Skin-Shop";$("back").classList.remove("hidden");
 $("content").innerHTML=`<p class="small">Münzen: ${coins}</p><div class="grid" id="skinGrid"></div>`;
 skins.forEach(s=>{
  const b=document.createElement("button");b.className="skin";
  b.textContent=(selected===s.id?"✓ ":"")+s.name+" · "+(owned.includes(s.id)?"Freigeschaltet":s.price+" Münzen");
  b.style.color=s.color;$("skinGrid").appendChild(b);
  b.onclick=()=>{
   if(owned.includes(s.id)){selected=s.id}
   else if(coins>=s.price){coins-=s.price;owned.push(s.id);selected=s.id}
   else{$("message").textContent="Du brauchst noch "+(s.price-coins)+" Münzen.";return}
   save();update();draw();showShop();
  };
 });
}
function showScores(){
 $("title").textContent="🏆 Bestenliste – Top 5";$("back").classList.remove("hidden");
 $("content").innerHTML="";
 if(!scores.length){$("content").textContent="Noch keine Rekorde. Starte deine erste Runde!";return}
 scores.forEach((s,i)=>{
  const r=document.createElement("div");r.className="row";
  r.textContent=["🥇","🥈","🥉","4.","5."][i]+" "+s.score+" Punkte · "+(s.date||"Rekord");
  $("content").appendChild(r);
 });
}
function showStats(){
 $("title").textContent="📊 Statistik";$("back").classList.remove("hidden");$("content").innerHTML="";
 [["Rekord",best+" Punkte"],["Münzen",coins],["Äpfel gesammelt",totalApples],["Gespielte Runden",totalRounds],["Skins",owned.length+" / "+skins.length],["Punkte dieser Runde",score]].forEach(([a,b])=>{
  const r=document.createElement("div");r.className="row";r.textContent=a+" : "+b;$("content").appendChild(r);
 });
}
$("start").onclick=()=>{if(running){stop();running=false;paused=false;start()}else start()};
$("pause").onclick=togglePause;
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound: An":"🔇 Sound: Aus";if(soundOn)tone()};
$("menuBtn").onclick=homeMenu;
$("close").onclick=()=>$("menu").classList.add("hidden");
$("back").onclick=homeMenu;
document.querySelectorAll("[data-dir]").forEach(b=>{
 b.addEventListener("pointerdown",e=>{e.preventDefault();resumeDirection(b.dataset.dir)});
});
document.addEventListener("keydown",e=>{
 const m={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};
 if(m[e.key]){e.preventDefault();resumeDirection(m[e.key])}
 else if(e.code==="Space"){e.preventDefault();togglePause()}
 else if(e.key==="Escape"&&(running||paused))togglePause();
});
let sx=0,sy=0;
canvas.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
canvas.addEventListener("pointerup",e=>{
 const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
 resumeDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
});
load();reset();update();
})();
</script>
</body>
</html>
