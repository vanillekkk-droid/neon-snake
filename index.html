
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Snake</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #080b18;
      color: #00ffcc;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    h1 {
      text-align: center;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #00ffcc;
    }

    .scores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      font-size: 19px;
      margin: 8px 0 16px;
    }

    canvas {
      width: min(90vw, 360px);
      height: auto;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 20px #00ffcc55;
      background: #101629;
      touch-action: none;
    }

    button {
      background: #00ffcc;
      color: #080b18;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: scale(0.96); }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 5px;
      margin-top: 12px;
    }

    .controls button {
      margin: 0;
      padding: 12px;
      font-size: 22px;
    }

    .empty { visibility: hidden; }

    #message, .help {
      color: #cbd5e1;
      text-align: center;
    }

    .panel {
      width: min(90vw, 360px);
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #00ffcc88;
      border-radius: 10px;
      background: #101629;
    }

    .panel h2 {
      margin-top: 0;
      text-align: center;
      font-size: 20px;
    }

    #leaderboard {
      padding-left: 28px;
      color: #e2e8f0;
      line-height: 1.8;
    }

    .options {
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <h1>NEON SNAKE</h1>

  <div class="scores">
    <span id="score">Punkte: 0</span>
    <span id="highscore">Highscore: 0</span>
  </div>

  <canvas id="game" width="360" height="360"></canvas>

  <p id="message">Drücke Start, um zu spielen!</p>
  <button id="start">Start / Neustart</button>

  <div class="controls">
    <span class="empty"></span>
    <button data-dir="up" aria-label="Nach oben">▲</button>
    <span class="empty"></span>
    <button data-dir="left" aria-label="Nach links">◀</button>
    <button data-dir="down" aria-label="Nach unten">▼</button>
    <button data-dir="right" aria-label="Nach rechts">▶</button>
  </div>

  <div class="options">
    <button id="soundToggle">🔊 Sound: An</button>
  </div>

  <section class="panel">
    <h2>🏆 Deine Top 5</h2>
    <ol id="leaderboard"></ol>
    <button id="clearScores">Bestenliste löschen</button>
  </section>

  <p class="help">
    Sammle rote Punkte und vermeide die Wände!
  </p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const highscoreText = document.getElementById("highscore");
    const message = document.getElementById("message");
    const startButton = document.getElementById("start");
    const leaderboard = document.getElementById("leaderboard");
    const soundToggle = document.getElementById("soundToggle");

    const size = 18;
    const cells = 20;

    let snake = [];
    let food = { x: 15, y: 10 };
    let dx = 1;
    let dy = 0;
    let score = 0;
    let timer = null;
    let running = false;
    let soundOn = true;
    let audioContext = null;
    let savedThisRound = false;

    function readScores() {
      try {
        const data = JSON.parse(
          localStorage.getItem("neonSnakeScores") || "[]"
        );

        if (Array.isArray(data)) {
          return data
            .filter(n => Number.isFinite(n) && n >= 0)
            .sort((a, b) => b - a)
            .slice(0, 5);
        }
      } catch (error) {}

      return [];
    }

    let scores = readScores();

    function getHighscore() {
      return Math.max(0, ...scores);
    }

    function updateScores() {
      highscoreText.textContent = "Highscore: " + getHighscore();

      leaderboard.replaceChildren();

      if (scores.length === 0) {
        const item = document.createElement("li");
        item.textContent = "Noch keine Rekorde";
        leaderboard.appendChild(item);
        return;
      }

      scores.forEach((points, index) => {
        const item = document.createElement("li");
        item.textContent = points + " Punkte";
        if (index === 0) item.textContent += " 👑";
        leaderboard.appendChild(item);
      });
    }

    function saveScore() {
      if (savedThisRound) return;
      savedThisRound = true;

      if (score <= 0) return;

      scores.push(score);
      scores.sort((a, b) => b - a);
      scores = scores.slice(0, 5);

      try {
        localStorage.setItem(
          "neonSnakeScores",
          JSON.stringify(scores)
        );
      } catch (error) {
        message.textContent += " (Speichern nicht möglich)";
      }

      updateScores();
    }

    function playTone(frequency, duration, type = "sine") {
      if (!soundOn) return;

      try {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(
          frequency, audioContext.currentTime
        );

        gain.gain.setValueAtTime(
          0.12, audioContext.currentTime
        );
        gain.gain.exponentialRampToValueAtTime(
          0.001, audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      } catch (error) {
        // Das Spiel läuft auch ohne Ton.
      }
    }

    function eatSound() {
      playTone(660, 0.12);
      setTimeout(() => playTone(880, 0.12), 90);
    }

    function gameOverSound() {
      playTone(330, 0.22, "triangle");
      setTimeout(
        () => playTone(220, 0.35, "triangle"), 180
      );
    }

    function newFood() {
      let f;

      do {
        f = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (
        snake.some(s => s.x === f.x && s.y === f.y)
      );

      return f;
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(
        x * size + 2,
        y * size + 2,
        size - 4,
        size - 4
      );
    }

    function draw() {
      ctx.fillStyle = "#101629";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#1c2940";

      for (let i = 0; i <= cells; i++) {
        ctx.beginPath();
        ctx.moveTo(i * size, 0);
        ctx.lineTo(i * size, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * size);
        ctx.lineTo(canvas.width, i * size);
        ctx.stroke();
      }

      drawCell(food.x, food.y, "#ff3366");

      snake.forEach((s, i) => {
        drawCell(s.x, s.y, i === 0 ? "#ffffff" : "#00ffcc");
      });
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      timer = null;

      saveScore();
      gameOverSound();

      message.textContent = "Spiel vorbei! Punkte: " + score;
    }

    function step() {
      const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
      };

      if (
        head.x < 0 || head.x >= cells ||
        head.y < 0 || head.y >= cells
      ) {
        endGame();
        return;
      }

      const eating =
        head.x === food.x && head.y === food.y;

      const body = eating ? snake : snake.slice(0, -1);

      if (body.some(s => s.x === head.x && s.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score += 10;
        scoreText.textContent = "Punkte: " + score;
        eatSound();
        food = newFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function changeDirection(direction) {
      if (!running) return;

      if (direction === "up" && dy !== 1) {
        dx = 0;
        dy = -1;
      } else if (direction === "down" && dy !== -1) {
        dx = 0;
        dy = 1;
      } else if (direction === "left" && dx !== 1) {
        dx = -1;
        dy = 0;
      } else if (direction === "right" && dx !== -1) {
        dx = 1;
        dy = 0;
      }
    }

    function startGame() {
      clearInterval(timer);

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 }
      ];

      dx = 1;
      dy = 0;
      score = 0;
      savedThisRound = false;
      running = true;

      scoreText.textContent = "Punkte: 0";
      message.textContent = "Viel Spaß!";

      food = newFood();
      draw();

      timer = setInterval(step, 140);
    }

    startButton.addEventListener("click", startGame);

    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("click", () => {
        changeDirection(button.dataset.dir);
      });
    });

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right"
      };

      if (keys[event.key]) {
        event.preventDefault();
        changeDirection(keys[event.key]);
      }
    });

    soundToggle.addEventListener("click", () => {
      soundOn = !soundOn;
      soundToggle.textContent =
        soundOn ? "🔊 Sound: An" : "🔇 Sound: Aus";

      if (soundOn) playTone(660, 0.12);
    });

    document.getElementById("clearScores").addEventListener(
      "click", () => {
        if (!confirm("Möchtest du die gesamte Bestenliste löschen?")) {
          return;
        }

        scores = [];

        try {
          localStorage.removeItem("neonSnakeScores");
        } catch (error) {}

        updateScores();
      }
    );

    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 }
    ];

    updateScores();
    draw();
  </script>
</body>
</html>
