
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>Neon Snake Arcade</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: #080d18;
  color: #eafff7;
  font-family: Arial, sans-serif;
  text-align: center;
  touch-action: manipulation;
}
h1 {
  color: #00ff9c;
  text-shadow: 0 0 15px #00ff9c;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: 12px;
  font-size: 18px;
}
canvas {
  display: block;
  width: min(92vw, 420px);
  height: min(92vw, 420px);
  margin: 16px auto;
  border: 2px solid #00ff9c;
  border-radius: 12px;
  background: #050912;
  box-shadow: 0 0 18px #00ff9c55;
}
button {
  color: #eafff7;
  background: #102b30;
  border: 2px solid #00ff9c;
  border-radius: 12px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
button:active {
  background: #00ff9c;
  color: #061018;
}
#start {
  padding: 12px 28px;
  margin: 6px;
}
.controls {
  width: min(92vw, 420px);
  margin: 14px auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 68px 68px 68px;
  gap: 8px;
}
.controls button {
  width: 100%;
  height: 100%;
  font-size: 30px;
}
.up { grid-column: 1 / 4; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
.down { grid-column: 1 / 4; grid-row: 3; }
.message {
  min-height: 24px;
  color: #00ff9c;
  margin: 10px;
}
</style>
</head>
<body>

<h1>🐍 Neon Snake</h1>

<div class="stats">
  <div>Punkte: <span id="score">0</span></div>
  <div>Rekord: <span id="highscore">0</span></div>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="message" id="message">Drücke Start zum Spielen!</div>
<button id="start">▶ Start / Neustart</button>

<div class="controls">
  <button class="up" data-dir="up" aria-label="Oben">▲</button>
  <button class="left" data-dir="left" aria-label="Links">◀</button>
  <button class="right" data-dir="right" aria-label="Rechts">▶</button>
  <button class="down" data-dir="down" aria-label="Unten">▼</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");
const messageEl = document.getElementById("message");

const SIZE = 20;
const CELLS = canvas.width / SIZE;

let snake, food, dx, dy, nextDx, nextDy;
let score = 0;
let highscore = 0;
let running = false;
let timer = null;

try {
  highscore = Number(localStorage.getItem("neonSnakeHighscore")) || 0;
} catch (e) {
  highscore = 0;
}
highscoreEl.textContent = highscore;

function resetGame() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  dx = 1;
  dy = 0;
  nextDx = 1;
  nextDy = 0;
  score = 0;
  scoreEl.textContent = score;
  placeFood();
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * CELLS),
      y: Math.floor(Math.random() * CELLS)
    };
  } while (
    snake && snake.some(part => part.x === food.x && part.y === food.y)
  );
}

function startGame() {
  clearInterval(timer);
  resetGame();
  running = true;
  messageEl.textContent = "Viel Spaß!";
  timer = setInterval(update, 120);
}

function endGame() {
  running = false;
  clearInterval(timer);
  messageEl.textContent = "Spiel vorbei! Drücke Start für eine neue Runde.";
}

function changeDirection(direction) {
  let newDx = dx;
  let newDy = dy;

  if (direction === "up")    { newDx = 0; newDy = -1; }
  if (direction === "down")  { newDx = 0; newDy = 1; }
  if (direction === "left")  { newDx = -1; newDy = 0; }
  if (direction === "right") { newDx = 1; newDy = 0; }

  // Keine sofortige 180-Grad-Wende erlauben.
  if (newDx === -dx && newDy === -dy) return;

  nextDx = newDx;
  nextDy = newDy;
}

function update() {
  if (!running) return;

  dx = nextDx;
  dy = nextDy;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  if (
    head.x < 0 || head.x >= CELLS ||
    head.y < 0 || head.y >= CELLS
  ) {
    endGame();
    return;
  }

  const eating = head.x === food.x && head.y === food.y;
  const bodyToCheck = eating ? snake : snake.slice(0, -1);

  if (bodyToCheck.some(part => part.x === head.x && part.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    scoreEl.textContent = score;

    if (score > highscore) {
      highscore = score;
      highscoreEl.textContent = highscore;
      try {
        localStorage.setItem("neonSnakeHighscore", String(highscore));
      } catch (e) {}
    }

    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#050912";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Dezentes Spielfeldraster
  ctx.strokeStyle = "#10202a";
  ctx.lineWidth = 1;

  for (let i = 0; i <= CELLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * SIZE, 0);
    ctx.lineTo(i * SIZE, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * SIZE);
    ctx.lineTo(canvas.width, i * SIZE);
    ctx.stroke();
  }

  // Futter
  ctx.fillStyle = "#ff3864";
  ctx.shadowColor = "#ff3864";
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(
    food.x * SIZE + SIZE / 2,
    food.y * SIZE + SIZE / 2,
    SIZE * 0.36,
    0,
    Math.PI * 2
  );
  ctx.fill();
  ctx.shadowBlur = 0;

  // Schlange
  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? "#b6ffe1" : "#00ff9c";
    ctx.shadowColor = "#00ff9c";
    ctx.shadowBlur = index === 0 ? 14 : 5;
    ctx.fillRect(
      part.x * SIZE + 2,
      part.y * SIZE + 2,
      SIZE - 4,
      SIZE - 4
    );
  });

  ctx.shadowBlur = 0;
}

document.getElementById("start").addEventListener("click", startGame);

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    changeDirection(button.dataset.dir);
  });
});

document.addEventListener("keydown", event => {
  const keys = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",
    w: "up",
    s: "down",
    a: "left",
    d: "right"
  };

  if (keys[event.key]) {
    event.preventDefault();
    changeDirection(keys[event.key]);
  }

  if (event.key === " " && !running) {
    startGame();
  }
});

resetGame();
</script>
</body>
</html>
