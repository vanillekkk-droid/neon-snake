
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>Neon Snake Arcade</title>

<style>
:root {
  --neon:#00ffa5;
  --cyan:#00eaff;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body {
  margin:0;
  padding:8px 16px 25px;
  background:radial-gradient(ellipse at top,#172c40,#080d18 70%);
  color:#eaf5ff;
  font-family:Arial,sans-serif;
  text-align:center;
  user-select:none;
  overflow-x:hidden;
}

header {margin:3px 0 12px;}

h1 {
  color:var(--neon);
  font-size:36px;
  margin:0;
  text-shadow:0 0 15px #00ffa566;
}

.subtitle {
  color:#94a4b9;
  font-size:14px;
  letter-spacing:2px;
  margin-top:5px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:25px;
}

.stat {
  background:#111d30;
  border:1px solid #304158;
  border-radius:17px;
  padding:9px 3px;
}

.stat span {
  display:block;
  color:#9aa9bc;
  font-size:14px;
}

.stat strong {
  display:block;
  color:var(--neon);
  font-size:29px;
  margin-top:2px;
}

.game-container {
  width:100%;
  aspect-ratio:1;
  border:3px solid var(--neon);
  border-radius:21px;
  overflow:hidden;
  background:#050b16;
  box-shadow:0 0 18px #00ffa522;
}

canvas {
  display:block;
  width:100%;
  height:100%;
}

.message {
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#b7c6d8;
  font-size:17px;
  padding:8px;
}

.actions {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.action {
  min-width:0;
  padding:17px 3px;
  border-radius:16px;
  background:#182b40;
  border:1px solid #39516a;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.action:active {transform:scale(.96);}

.action.play {
  background:var(--neon);
  color:#001a16;
  border:2px solid #55ffc2;
}

/* QUADRATISCHES STEUERKREUZ */

.controller {
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  height:auto;
  margin:12px auto 0;
  background:linear-gradient(145deg,#0b1927,#07101b);
  border:2px solid #087f65;
  border-radius:26px;
  box-shadow:
    inset 0 0 20px #00ffa522,
    0 0 12px #00ffa522;
  overflow:hidden;
  touch-action:none;
}

/* Jede Taste ist eine eigene Fläche */

.key {
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:0;
  background:#00efa0;
  color:white;
  font-size:clamp(30px,8vw,48px);
  font-weight:bold;
  cursor:pointer;
  touch-action:none;
  filter:drop-shadow(0 0 7px #00ffa566);
}

.key::before {
  content:"";
  position:absolute;
  inset:4px;
  background:linear-gradient(145deg,#10453e,#09252d);
  z-index:0;
}

.key span {
  position:relative;
  z-index:1;
  text-shadow:0 0 8px #ffffff88;
}

.key:active {
  filter:drop-shadow(0 0 16px #00ffa5);
}

.key:active::before {
  background:#087b64;
}

/* OBEN – EIGENES TRAPEZ */

.key.up {
  top:2%;
  left:4%;
  width:92%;
  height:31%;
  clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);
}

.key.up::before {
  clip-path:polygon(1% 4%,99% 4%,69% 96%,31% 96%);
}

/* UNTEN – EIGENES TRAPEZ */

.key.down {
  bottom:2%;
  left:4%;
  width:92%;
  height:31%;
  clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);
}

.key.down::before {
  clip-path:polygon(31% 4%,69% 4%,99% 96%,1% 96%);
}

/* LINKS – EIGENES SEITENTEIL */

.key.left {
  left:2%;
  top:35%;
  width:31%;
  height:30%;
  clip-path:polygon(0 0,100% 25%,100% 75%,0 100%);
}

.key.left::before {
  clip-path:polygon(4% 5%,96% 28%,96% 72%,4% 95%);
}

/* RECHTS – EIGENES SEITENTEIL */

.key.right {
  right:2%;
  top:35%;
  width:31%;
  height:30%;
  clip-path:polygon(0 25%,100% 0,100% 100%,0 75%);
}

.key.right::before {
  clip-path:polygon(4% 28%,96% 5%,96% 95%,4% 72%);
}

/* MITTE – START / PAUSE */

.key.center {
  top:35%;
  left:35%;
  width:30%;
  height:30%;
  border-radius:18px;
  background:var(--cyan);
  font-size:40px;
  filter:drop-shadow(0 0 10px #00dfff88);
}

.key.center::before {
  inset:4px;
  border-radius:14px;
  background:linear-gradient(145deg,#073b70,#102c55);
}

/* MENÜ */

.panel {
  display:none;
  margin-top:15px;
  padding:18px;
  background:#122238;
  border:1px solid #34506b;
  border-radius:18px;
  text-align:left;
}

.panel h2 {
  color:var(--neon);
  text-align:center;
}

.panel button {
  background:#19344d;
  color:white;
  border:1px solid #3a617c;
  border-radius:10px;
  padding:10px;
  margin:4px;
}

.skin-list {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.skin {
  padding:12px;
  border:1px solid #39516a;
  border-radius:12px;
  background:#0b1727;
  text-align:center;
}

.skin button {width:100%;}

footer {
  color:#64758a;
  font-size:12px;
  padding:15px;
}

</style>
</head>

<body>

<header>
<h1>🐍 Neon Snake</h1>
<div class="subtitle">ARCADE EDITION · EAT · COLLECT · UNLOCK</div>
</header>

<div class="stats">
  <div class="stat"><span>PUNKTE</span><strong id="score">0</strong></div>
  <div class="stat"><span>🪙 MÜNZEN</span><strong id="coins">0</strong></div>
  <div class="stat"><span>REKORD</span><strong id="record">0</strong></div>
</div>

<div class="game-container">
<canvas id="game" width="360" height="360"></canvas>
</div>

<div class="message" id="message">
Tippe auf Spielen oder eine Richtungstaste.
</div>

<div class="actions">
<button class="action play" id="startBtn">▶ Spielen</button>
<button class="action" id="soundBtn">🔊 Sound: An</button>
<button class="action" id="menuBtn">☰ Menü</button>
</div>

<!-- DEIN NEUES QUADRATISCHES STEUERKREUZ -->

<div class="controller">

<button class="key up" data-dir="up"><span>↑</span></button>

<button class="key left" data-dir="left"><span>←</span></button>

<button class="key center" id="pauseBtn"><span>▶</span></button>

<button class="key right" data-dir="right"><span>→</span></button>

<button class="key down" data-dir="down"><span>↓</span></button>

</div>

<div class="panel" id="menuPanel">
<h2>🎮 Neon Snake Menü</h2>
<p>Äpfel: <strong id="apples">0</strong></p>
<p>Gespielte Runden: <strong id="rounds">0</strong></p>
<hr>
<h2>🏆 Bestenliste</h2>
<div id="leaderboard"></div>
<hr>
<h2>🎨 Skin Shop</h2>
<div class="skin-list" id="skinList"></div>
<button onclick="closeMenu()">Schließen</button>
</div>

<footer>NEON SNAKE ARCADE · HAVE FUN</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");

function getNumber(key,fallback) {
  const value=localStorage.getItem(key);
  const number=Number(value);
  return value!==null && Number.isFinite(number)?number:fallback;
}

function getArray(key,fallback) {
  try {
    const value=JSON.parse(localStorage.getItem(key));
    return Array.isArray(value)?value:fallback;
  } catch {
    return fallback;
  }
}

/* SPEICHER */

let coins=getNumber("nsa_coins",0);
let record=getNumber("neonSnakeHighscore",0);
let apples=getNumber("nsa_apples",0);
let rounds=getNumber("nsa_rounds",0);

let owned=getArray("nsa_owned",["green"]);
if (!owned.includes("green")) owned.push("green");

let selected=localStorage.getItem("nsa_selected")||"green";
let scores=getArray("neonSnakeScores",[]);

function save() {
  localStorage.setItem("nsa_coins",coins);
  localStorage.setItem("neonSnakeHighscore",record);
  localStorage.setItem("nsa_apples",apples);
  localStorage.setItem("nsa_rounds",rounds);
  localStorage.setItem("nsa_owned",JSON.stringify(owned));
  localStorage.setItem("nsa_selected",selected);
  localStorage.setItem("neonSnakeScores",JSON.stringify(scores));
}

/* SKINS */

const skins=[
{id:"green",name:"Neon Grün",color:"#00ff9c",price:0},
{id:"blue",name:"Electric Blau",color:"#00cfff",price:100},
{id:"purple",name:"Purple",color:"#bd65ff",price:200},
{id:"gold",name:"Gold",color:"#ffd34e",price:300},
{id:"pink",name:"Pink",color:"#ff3985",price:400},
{id:"ice",name:"Ice",color:"#b5f5ff",price:500}
];

function currentSkin() {
  return skins.find(s=>s.id===selected)||skins[0];
}

function renderShop() {
  const list=$("skinList");
  list.innerHTML="";

  skins.forEach(skin=>{
    const div=document.createElement("div");
    div.className="skin";

    const name=document.createElement("strong");
    name.style.color=skin.color;
    name.textContent=skin.name;

    const button=document.createElement("button");

    if (owned.includes(skin.id)) {
      button.textContent=selected===skin.id?"Ausgewählt ✓":"Auswählen";
      button.onclick=()=>{
        selected=skin.id;
        save();
        renderShop();
        draw();
      };
    } else {
      button.textContent=skin.price+" Münzen";
      button.onclick=()=>{
        if (coins>=skin.price) {
          coins-=skin.price;
          owned.push(skin.id);
          selected=skin.id;
          save();
          updateStats();
          renderShop();
          draw();
        } else {
          $("message").textContent="Nicht genügend Münzen!";
        }
      };
    }

    div.append(name,document.createElement("br"),button);
    list.appendChild(div);
  });
}

/* SPIEL */

const SIZE=20;
const CELLS=18;

let snake=[];
let direction={x:1,y:0};
let nextDirection={x:1,y:0};
let apple={x:5,y:5};
let coin={x:12,y:12};

let score=0;
let running=false;
let gameOver=false;
let timer=null;

function randomPosition() {
  let pos;

  do {
    pos={
      x:Math.floor(Math.random()*CELLS),
      y:Math.floor(Math.random()*CELLS)
    };
  } while (
    snake.some(s=>s.x===pos.x&&s.y===pos.y) ||
    (apple.x===pos.x&&apple.y===pos.y) ||
    (coin.x===pos.x&&coin.y===pos.y)
  );

  return pos;
}

function resetGame() {
  snake=[
    {x:8,y:9},
    {x:7,y:9},
    {x:6,y:9}
  ];

  direction={x:1,y:0};
  nextDirection={x:1,y:0};
  score=0;
  gameOver=false;

  apple=randomPosition();
  coin=randomPosition();

  updateStats();
  draw();
}

function updateStats() {
  $("score").textContent=score;
  $("coins").textContent=coins;
  $("record").textContent=record;
  $("apples").textContent=apples;
  $("rounds").textContent=rounds;
}

function startGame() {
  if (running) return;

  if (gameOver) resetGame();

  running=true;
  rounds++;
  save();

  $("message").textContent="Viel Spaß!";
  $("startBtn").textContent="Ⅱ Pause";
  $("pauseBtn").querySelector("span").textContent="Ⅱ";

  updateStats();

  clearInterval(timer);
  timer=setInterval(tick,145);
}

function pauseGame() {
  if (!running) return;

  running=false;
  clearInterval(timer);

  $("startBtn").textContent="▶ Weiter";
  $("pauseBtn").querySelector("span").textContent="▶";
  $("message").textContent="Spiel pausiert";
}

function toggleGame() {
  if (running) pauseGame();
  else startGame();
}

function setDirection(x,y) {
  if (x===-direction.x&&y===-direction.y) return;

  nextDirection={x,y};

  if (!running) startGame();
}

function tick() {
  direction=nextDirection;

  const head={
    x:snake[0].x+direction.x,
    y:snake[0].y+direction.y
  };

  if (head.x<0||head.x>=CELLS||head.y<0||head.y>=CELLS) {
    endGame();
    return;
  }

  const eatingApple=head.x===apple.x&&head.y===apple.y;
  const eatingCoin=head.x===coin.x&&head.y===coin.y;

  const body=eatingApple?snake:snake.slice(0,-1);

  if (body.some(s=>s.x===head.x&&s.y===head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (eatingApple) {
    score+=10;
    apples++;
    apple=randomPosition();
    playSound(600);
  } else {
    snake.pop();
  }

  if (eatingCoin) {
    coins+=5;
    coin=randomPosition();
    playSound(900);
  }

  if (score>record) record=score;

  updateStats();
  save();
  draw();
}

function endGame() {
  running=false;
  gameOver=true;
  clearInterval(timer);

  scores.push(score);
  scores.sort((a,b)=>b-a);
  scores.splice(5);

  save();
  updateStats();

  $("startBtn").textContent="▶ Neu starten";
  $("pauseBtn").querySelector("span").textContent="▶";
  $("message").textContent="Spiel vorbei! Tippe auf Spielen.";

  playSound(180);
}

/* ZEICHNEN */

function draw() {
  ctx.clearRect(0,0,360,360);
  ctx.fillStyle="#050b16";
  ctx.fillRect(0,0,360,360);

  ctx.strokeStyle="#111c2c";
  ctx.lineWidth=1;

  for(let i=0;i<=360;i+=20) {
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,360);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(360,i);
    ctx.stroke();
  }

  drawOrb(apple.x,apple.y,"#ff3270");
  drawOrb(coin.x,coin.y,"#ffd447");

  const color=currentSkin().color;

  snake.forEach((part,index)=>{
    ctx.shadowBlur=10;
    ctx.shadowColor=color;
    ctx.fillStyle=index===0?"#ffffff":color;
    ctx.fillRect(part.x*SIZE+1,part.y*SIZE+1,SIZE-3,SIZE-3);
  });

  ctx.shadowBlur=0;
}

function drawOrb(x,y,color) {
  ctx.save();
  ctx.shadowBlur=17;
  ctx.shadowColor=color;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x*SIZE+10,y*SIZE+10,7,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* SOUND */

let audioContext=null;
let soundOn=true;

function playSound(frequency) {
  if (!soundOn) return;

  try {
    audioContext=audioContext||
      new (window.AudioContext||window.webkitAudioContext)();

    if(audioContext.state==="suspended") audioContext.resume();

    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();

    oscillator.frequency.value=frequency;
    gain.gain.value=0.06;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime+0.09);
  } catch(e) {}
}

/* TOUCH-TASTEN */

document.querySelectorAll("[data-dir]").forEach(button=>{
  button.addEventListener("pointerdown",event=>{
    event.preventDefault();

    const dir=button.dataset.dir;

    if(dir==="up") setDirection(0,-1);
    if(dir==="down") setDirection(0,1);
    if(dir==="left") setDirection(-1,0);
    if(dir==="right") setDirection(1,0);
  });
});

/* TASTATUR */

document.addEventListener("keydown",event=>{
  const key=event.key.toLowerCase();

  if([
    "arrowup","arrowdown","arrowleft","arrowright",
    "w","a","s","d"," "
  ].includes(key)) event.preventDefault();

  switch(key) {
    case "arrowup":
    case "w":setDirection(0,-1);break;
    case "arrowdown":
    case "s":setDirection(0,1);break;
    case "arrowleft":
    case "a":setDirection(-1,0);break;
    case "arrowright":
    case "d":setDirection(1,0);break;
    case " ":toggleGame();break;
  }
});

/* BEDIENUNG */

$("startBtn").addEventListener("click",toggleGame);
$("pauseBtn").addEventListener("click",toggleGame);

$("soundBtn").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"🔊 Sound: An":"🔇 Sound: Aus";
});

$("menuBtn").addEventListener("click",()=>{
  const open=$("menuPanel").style.display==="block";
  $("menuPanel").style.display=open?"none":"block";

  if(!open) {
    renderShop();
    renderLeaderboard();
  }
});

function closeMenu() {
  $("menuPanel").style.display="none";
}

function renderLeaderboard() {
  const board=$("leaderboard");
  board.innerHTML="";

  if(!scores.length) {
    board.textContent="Noch keine Ergebnisse.";
    return;
  }

  scores.forEach((value,index)=>{
    const row=document.createElement("p");
    row.textContent=(index+1)+". Platz: "+value+" Punkte";
    board.appendChild(row);
  });
}

/* WISCHSTEUERUNG */

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",event=>{
  const touch=event.changedTouches[0];
  touchStartX=touch.clientX;
  touchStartY=touch.clientY;
},{passive:true});

canvas.addEventListener("touchend",event=>{
  const touch=event.changedTouches[0];
  const dx=touch.clientX-touchStartX;
  const dy=touch.clientY-touchStartY;

  if(Math.abs(dx)<15&&Math.abs(dy)<15)return;

  if(Math.abs(dx)>Math.abs(dy)) {
    setDirection(dx>0?1:-1,0);
  } else {
    setDirection(0,dy>0?1:-1);
  }
},{passive:true});

/* INITIALISIERUNG */

resetGame();
updateStats();
renderShop();
draw();

</script>
</body>
</html>
