
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>Neon Snake Arcade</title>
<style>
:root{--neon:#00ff9c;--bg:#080d18;--panel:#142235;--line:#30445b;--text:#eaf4ff;--muted:#9aa9bd}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding:12px 12px 28px;max-width:760px;margin:auto;overflow-x:hidden}
header{text-align:center;padding:2px 0 12px}
h1{font-size:30px;color:var(--neon);margin:0;font-weight:800;text-shadow:0 0 16px #00ff9c55}
.sub{font-size:12px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:#121d30;border:1px solid #304057;border-radius:17px;text-align:center;padding:8px 3px;color:var(--muted);font-size:13px}
.stat strong{display:block;color:var(--neon);font-size:27px;line-height:1.15}
#game{display:block;width:100%;height:auto;aspect-ratio:1/1;background:#070d19;border:3px solid #35ffad;border-radius:25px;box-shadow:0 0 22px #00ff9c22;touch-action:none}
#status{text-align:center;color:#b7c4d6;font-size:16px;min-height:48px;padding:15px 4px 8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
button{font:inherit;color:var(--text);border:1px solid #40546d;background:#192b40;border-radius:17px;padding:13px 7px;min-height:54px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0b}
button:active{transform:scale(.98);filter:brightness(1.2)}
button.primary{background:#00e99a;color:#061a18;border:2px solid #54ffc0;font-weight:700;box-shadow:0 0 12px #00ff9c44}
button:disabled{opacity:.45;cursor:not-allowed}

/* GESCHLOSSENES STEUERKREUZ */
.controller{position:relative;width:100%;max-width:430px;height:190px;margin:11px auto 0;background:#07101b;border:2px solid #087f65;border-radius:25px;box-shadow:inset 0 0 15px #00ffa522,0 0 10px #00ffa522;overflow:hidden;touch-action:none}
.key{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:#00efa0;color:white;font-size:29px;font-weight:bold;cursor:pointer;touch-action:none;z-index:1;box-shadow:none}
.key::before{content:"";position:absolute;inset:4px;background:linear-gradient(145deg,#10453e,#09252d);z-index:0}
.key span{position:absolute;z-index:2;transform:translate(-50%,-50%);text-shadow:0 0 9px white;pointer-events:none}
.key:active::before{background:#087b64}
.key.up{clip-path:polygon(0 0,100% 0,68% 36%,32% 36%)}
.key.up::before{clip-path:polygon(1% 2%,99% 2%,67% 34%,33% 34%)}
.key.up span{left:50%;top:19%}
.key.left{clip-path:polygon(0 0,37% 36%,37% 64%,0 100%)}
.key.left::before{clip-path:polygon(2% 2%,35% 37%,35% 63%,2% 98%)}
.key.left span{left:16%;top:50%}
.key.right{clip-path:polygon(63% 36%,100% 0,100% 100%,63% 64%)}
.key.right::before{clip-path:polygon(65% 37%,98% 2%,98% 98%,65% 63%)}
.key.right span{left:84%;top:50%}
.key.down{clip-path:polygon(32% 64%,68% 64%,100% 100%,0 100%)}
.key.down::before{clip-path:polygon(33% 66%,67% 66%,99% 98%,1% 98%)}
.key.down span{left:50%;top:81%}
.key.center{inset:36% auto auto 37%;width:26%;height:28%;border:4px solid #00eaff;border-radius:13px;background:#00dfff;z-index:5;filter:drop-shadow(0 0 7px #00dfff88)}
.key.center::before{inset:3px;clip-path:none;border-radius:7px;background:linear-gradient(145deg,#073b70,#102c55)}
.key.center span{left:50%;top:50%;font-size:28px}
footer{text-align:center;color:#6e7c91;font-size:12px;letter-spacing:1px;padding:16px 0 4px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal.show{display:flex}
.dialog{width:min(560px,100%);max-height:86vh;overflow:auto;background:#101c2e;border:1px solid #36506a;border-radius:20px;padding:18px;box-shadow:0 10px 50px #000}
.dialog h2{margin:0 0 12px;color:var(--neon)}
.dialog h3{margin:16px 0 8px;color:#c8f8e5;font-size:16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #26384d}
.item small{display:block;color:var(--muted);margin-top:3px;line-height:1.4}
.item button{min-height:39px;padding:7px 12px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 button{min-height:44px}
.close{width:100%;margin-top:15px}
.note{color:var(--muted);font-size:13px;line-height:1.45}
.progress{height:7px;background:#26384d;border-radius:10px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:var(--neon)}
@media(max-width:380px){body{padding-left:9px;padding-right:9px}.controller{height:170px}.key{font-size:25px}.key.center span{font-size:25px}}
@media(min-width:600px){body{padding-top:18px}.controller{height:220px}}
</style>
</head>
<body>

<header>
<h1>🐍 Neon Snake</h1>
<div class="sub">ARCADE EDITION · EAT · COLLECT · UNLOCK</div>
</header>

<section class="stats">
 <div class="stat">PUNKTE<strong id="score">0</strong></div>
 <div class="stat">🪙 MÜNZEN<strong id="coins">0</strong></div>
 <div class="stat">REKORD<strong id="best">0</strong></div>
</section>

<canvas id="game" width="360" height="360" aria-label="Neon Snake Spielfeld"></canvas>

<div id="status">Tippe auf Spielen oder eine Richtungstaste.</div>

<div class="actions">
 <button id="start" class="primary">▶ Spielen</button>
 <button id="sound">🔊 Sound: An</button>
 <button id="menu">☰ Menü</button>
</div>

<div class="controller" aria-label="Steuerkreuz">
 <button class="key up" data-dir="up" aria-label="Oben"><span>↑</span></button>
 <button class="key left" data-dir="left" aria-label="Links"><span>←</span></button>
 <button class="key right" data-dir="right" aria-label="Rechts"><span>→</span></button>
 <button class="key down" data-dir="down" aria-label="Unten"><span>↓</span></button>
 <button class="key center" id="pause" aria-label="Start oder Pause"><span>▶</span></button>
</div>

<footer>NEON SNAKE ARCADE · HAVE FUN</footer>

<div class="modal" id="modal">
 <div class="dialog">
  <h2 id="modalTitle">Neon Snake</h2>
  <div id="modalBody"></div>
  <button class="close" id="close">Schließen</button>
 </div>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const N=18,CELL=20;

const STORE={
 coins:'nsa_coins',
 best:'neonSnakeHighscore',
 apples:'nsa_apples',
 rounds:'nsa_rounds',
 owned:'nsa_owned',
 selected:'nsa_selected',
 scores:'neonSnakeScores'
};

function read(key,fallback){
 try{
  const v=localStorage.getItem(key);
  return v===null?fallback:JSON.parse(v);
 }catch(e){return fallback}
}

function save(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}
}

let coins=Math.max(0,Number(read(STORE.coins,0))||0);
let best=Math.max(0,Number(read(STORE.best,0))||0);
let apples=Math.max(0,Number(read(STORE.apples,0))||0);
let rounds=Math.max(0,Number(read(STORE.rounds,0))||0);

let owned=read(STORE.owned,['green']);
if(!Array.isArray(owned))owned=['green'];

let selected=read(STORE.selected,'green');
if(!owned.includes(selected))selected=owned[0]||'green';

let scores=read(STORE.scores,[]);
if(!Array.isArray(scores))scores=[];

let soundOn=true;
let running=false;
let over=false;
let paused=false;
let timer=null;

let score=0;
let snake=[];
let dir={x:1,y:0};
let nextDir={x:1,y:0};
let food={x:8,y:8};
let bonus=null;

let particles=[];
let power=null;
let powerUntil=0;
let slowUntil=0;
let shieldUntil=0;
let doubleUntil=0;

let mode='classic';
let modeUntil=0;
let theme='midnight';

let ownedThemes=read('nsa_owned_themes',['midnight']);
if(!Array.isArray(ownedThemes))ownedThemes=['midnight'];

let missionProgress=read('nsa_mission_progress',{eat:0,coins:0,rounds:0});
if(!missionProgress||typeof missionProgress!=='object')
 missionProgress={eat:0,coins:0,rounds:0};

let achievements=read('nsa_achievements',[]);
if(!Array.isArray(achievements))achievements=[];

let dailyDate=read('nsa_daily_date','');

const skins=[
{id:'green',name:'Neon Grün',cost:0,color:'#b9ffff',glow:'#00ff9c'},
{id:'blue',name:'Cyber Blau',cost:150,color:'#b9e7ff',glow:'#35a8ff'},
{id:'purple',name:'Plasma Lila',cost:250,color:'#ead0ff',glow:'#b65cff'},
{id:'gold',name:'Gold Blitz',cost:400,color:'#fff0a6',glow:'#ffc83d'},
{id:'pink',name:'Pink Pulse',cost:550,color:'#ffd0e4',glow:'#ff3985'},
{id:'ice',name:'Eis Drache',cost:700,color:'#e4ffff',glow:'#6deaff'},
{id:'fire',name:'Feuer Schlange',cost:900,color:'#ffe0ad',glow:'#ff682e'},
{id:'toxic',name:'Toxic',cost:1100,color:'#e5ff9c',glow:'#a5ff00'},
{id:'royal',name:'Royal',cost:1500,color:'#fff0ff',glow:'#dc75ff'}
];

const themes=[
{id:'midnight',name:'Midnight Grid',cost:0,bg:'#070d19',grid:'#142236',edge:'#35ffad'},
{id:'ocean',name:'Deep Ocean',cost:300,bg:'#041522',grid:'#12384b',edge:'#36d9ff'},
{id:'sunset',name:'Solar Flare',cost:450,bg:'#1b101b',grid:'#42213a',edge:'#ff7b55'},
{id:'matrix',name:'Matrix',cost:600,bg:'#020e09',grid:'#12331d',edge:'#8cff4b'},
{id:'galaxy',name:'Galaxy',cost:850,bg:'#100b24',grid:'#30234e',edge:'#b58cff'}
];

const modes=[
{id:'classic',name:'Klassisch',desc:'Normales Spiel'},
{id:'time',name:'Zeit-Modus',desc:'90 Sekunden Zeitlimit'},
{id:'rush',name:'Rush',desc:'Wird mit jedem Apfel schneller'}
];

const powers={
 speed:'Turbo',
 slow:'Zeitlupe',
 shield:'Schild',
 double:'Doppel-Münzen'
};

const missions=[
{id:'eat',title:'Snack-Time',desc:'Iss 10 Äpfel',goal:10,reward:100},
{id:'coins',title:'Münzjäger',desc:'Sammle 50 Münzen',goal:50,reward:125},
{id:'rounds',title:'Dranbleiben',desc:'Spiele 3 Runden',goal:3,reward:150}
];

function persist(){
 save(STORE.coins,coins);
 save(STORE.best,best);
 save(STORE.apples,apples);
 save(STORE.rounds,rounds);
 save(STORE.owned,owned);
 save(STORE.selected,selected);
 save(STORE.scores,scores);
 save('nsa_owned_themes',ownedThemes);
 save('nsa_mission_progress',missionProgress);
 save('nsa_achievements',achievements);
 save('nsa_daily_date',dailyDate);
}

function skin(){
 return skins.find(x=>x.id===selected)||skins[0];
}

function boardTheme(){
 return themes.find(x=>x.id===theme)||themes[0];
}

function updateUI(){
 $('score').textContent=score;
 $('coins').textContent=coins;
 $('best').textContent=best;
 $('start').textContent=over?'▶ Neu starten':running?'Ⅱ Pause':'▶ Spielen';
 $('pause').querySelector('span').textContent=running?'Ⅱ':'▶';
 $('sound').textContent=soundOn?'🔊 Sound: An':'🔇 Sound: Aus';
}

function status(t){
 $('status').textContent=t;
}

function beep(freq=440,duration=.06){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  const a=new AC();
  const o=a.createOscillator();
  const g=a.createGain();
  o.frequency.value=freq;
  g.gain.value=.025;
  o.connect(g);
  g.connect(a.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
  o.stop(a.currentTime+duration);
  o.onended=()=>a.close();
 }catch(e){}
}

function randomCell(){
 let p,tries=0;
 do{
  p={
   x:Math.floor(Math.random()*N),
   y:Math.floor(Math.random()*N)
  };
  tries++;
 }while(snake.some(s=>s.x===p.x&&s.y===p.y)&&tries<500);
 return p;
}

function placeFood(){
 food=randomCell();
}

function reset(){
 clearTimeout(timer);
 score=0;
 snake=[
  {x:8,y:9},
  {x:7,y:9},
  {x:6,y:9}
 ];
 dir={x:1,y:0};
 nextDir={x:1,y:0};
 running=false;
 paused=false;
 over=false;
 bonus=null;
 power=null;
 powerUntil=slowUntil=shieldUntil=doubleUntil=0;
 particles=[];
 placeFood();
 if(mode==='time')modeUntil=Date.now()+90000;
 status('Tippe auf Spielen oder eine Richtungstaste.');
 updateUI();
 draw();
}

function startGame(){
 if(over)reset();
 if(!running){
  running=true;
  paused=false;
  status(mode==='time'?'Zeit-Modus läuft!':'Viel Spaß!');
  schedule();
  beep(600);
 }
 updateUI();
 draw();
}

function pauseGame(){
 if(over)return;
 if(running){
  running=false;
  paused=true;
  clearTimeout(timer);
  status('Pausiert – tippe ▶ zum Fortsetzen.');
 }else{
  startGame();
 }
 updateUI();
 draw();
}

function schedule(){
 clearTimeout(timer);
 if(!running)return;
 let base=mode==='rush'
  ?Math.max(65,150-Math.floor(score/40)*8)
  :150;
 let delay=Date.now()<slowUntil
  ?base*1.6
  :Date.now()<powerUntil
   ?base*.68
   :base;
 timer=setTimeout(tick,delay);
}

function particle(x,y,color){
 for(let i=0;i<8;i++){
  particles.push({
   x:x*CELL+10,
   y:y*CELL+10,
   vx:(Math.random()-.5)*3,
   vy:(Math.random()-.5)*3,
   life:24,
   color
  });
 }
}

function addCoins(amount){
 const gain=Date.now()<doubleUntil?amount*2:amount;
 coins+=gain;
 missionProgress.coins=(missionProgress.coins||0)+gain;
 persist();
 updateUI();
}

function tick(){
 if(!running)return;

 if(mode==='time'&&Date.now()>=modeUntil){
  finish('Zeit abgelaufen!');
  return;
 }

 dir=nextDir;

 const head={
  x:snake[0].x+dir.x,
  y:snake[0].y+dir.y
 };

 const wall=head.x<0||head.y<0||head.x>=N||head.y>=N;
 const self=snake.some((p,i)=>
  i<snake.length-1&&p.x===head.x&&p.y===head.y
 );

 if((wall||self)&&Date.now()>shieldUntil){
  finish('Spiel vorbei! Tippe auf Neu starten.');
  return;
 }

 if(wall){
  head.x=(head.x+N)%N;
  head.y=(head.y+N)%N;
 }

 snake.unshift(head);

 if(head.x===food.x&&head.y===food.y){
  score+=10;
  apples++;
  missionProgress.eat=(missionProgress.eat||0)+1;
  addCoins(5);
  particle(food.x,food.y,skin().glow);
  placeFood();
  beep(720);

  if(score>0&&score%50===0)spawnPower();
  if(score%100===0&&!bonus)bonus=randomCell();
 }else{
  snake.pop();
 }

 if(power&&head.x===power.x&&head.y===power.y)
  activatePower();

 if(bonus&&head.x===bonus.x&&head.y===bonus.y){
  addCoins(15);
  particle(bonus.x,bonus.y,'#ffd34e');
  bonus=null;
  beep(900);
  status('Bonus-Münzen eingesammelt!');
 }

 particles=particles.filter(p=>p.life>0);
 particles.forEach(p=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.life--;
 });

 if(score>best)best=score;

 updateMissions();
 checkAchievements();
 persist();
 updateUI();
 draw();
 schedule();
}

function spawnPower(){
 const types=Object.keys(powers);
 const type=types[Math.floor(Math.random()*types.length)];
 power={...randomCell(),type,until:Date.now()+9000};
 status('Power-up erschienen: '+powers[type]+'!');
}

function activatePower(){
 if(!power)return;
 const p=power;
 particle(p.x,p.y,'#ffffff');

 if(p.type==='speed')powerUntil=Date.now()+7000;
 if(p.type==='slow')slowUntil=Date.now()+7000;
 if(p.type==='shield')shieldUntil=Date.now()+9000;
 if(p.type==='double')doubleUntil=Date.now()+10000;

 status('Power-up aktiviert: '+powers[p.type]+'!');
 power=null;
 beep(980);
}

function finish(message){
 if(!running&&!over)return;
 running=false;
 over=true;
 clearTimeout(timer);
 rounds++;
 missionProgress.rounds=(missionProgress.rounds||0)+1;
 scores.unshift({
  score,
  date:new Date().toLocaleDateString('de-DE')
 });
 scores=scores.slice(0,10);
 status(message);
 updateMissions();
 checkAchievements();
 persist();
 updateUI();
 draw();
 beep(180,.2);
}

function draw(){
 const t=boardTheme(),s=skin();
 ctx.clearRect(0,0,360,360);
 ctx.fillStyle=t.bg;
 ctx.fillRect(0,0,360,360);

 ctx.strokeStyle=t.grid;
 ctx.lineWidth=1;

 for(let i=0;i<=N;i++){
  ctx.beginPath();
  ctx.moveTo(i*CELL+.5,0);
  ctx.lineTo(i*CELL+.5,360);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,i*CELL+.5);
  ctx.lineTo(360,i*CELL+.5);
  ctx.stroke();
 }

 function orb(p,color,r=7){
  ctx.save();
  ctx.shadowBlur=16;
  ctx.shadowColor=color;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(p.x*CELL+10,p.y*CELL+10,r,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 }

 if(food)orb(food,'#ffd34e');
 if(bonus)orb(bonus,'#ff3985');

 if(power&&Date.now()<power.until){
  ctx.save();
  ctx.translate(power.x*CELL+10,power.y*CELL+10);
  ctx.rotate(Date.now()/250);
  ctx.shadowBlur=16;
  ctx.shadowColor='#b65cff';
  ctx.fillStyle='#d8a4ff';
  ctx.fillRect(-7,-7,14,14);
  ctx.restore();
 }else if(power&&Date.now()>=power.until){
  power=null;
 }

 snake.forEach((p,i)=>{
  ctx.save();
  ctx.shadowBlur=i===0?15:8;
  ctx.shadowColor=s.glow;
  ctx.fillStyle=i===0?'#ffffff':s.color;
  ctx.fillRect(p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4);
  ctx.restore();
 });

 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/24);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,3,3);
 });
 ctx.globalAlpha=1;

 ctx.strokeStyle=t.edge;
 ctx.lineWidth=3;
 ctx.strokeRect(1.5,1.5,357,357);
}

function changeDirection(name){
 const map={
  up:{x:0,y:-1},
  down:{x:0,y:1},
  left:{x:-1,y:0},
  right:{x:1,y:0}
 };
 const d=map[name];
 if(!d)return;
 if(d.x===-dir.x&&d.y===-dir.y)return;
 nextDir=d;
 if(!running)startGame();
}

document.querySelectorAll('[data-dir]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  changeDirection(b.dataset.dir);
 });
});

$('start').addEventListener('click',()=>{
 running?pauseGame():startGame();
});
$('pause').addEventListener('click',pauseGame);
$('sound').addEventListener('click',()=>{
 soundOn=!soundOn;
 updateUI();
 beep();
});
$('menu').addEventListener('click',openMenu);
$('close').addEventListener('click',closeModal);

$('modal').addEventListener('click',e=>{
 if(e.target===$('modal'))closeModal();
});

document.addEventListener('keydown',e=>{
 const keys={
  ArrowUp:'up',w:'up',
  ArrowDown:'down',s:'down',
  ArrowLeft:'left',a:'left',
  ArrowRight:'right',d:'right'
 };
 if(keys[e.key]){
  e.preventDefault();
  changeDirection(keys[e.key]);
 }
 if(e.key===' '){
  e.preventDefault();
  pauseGame();
 }
});

function openModal(title,html){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML=html;
 $('modal').classList.add('show');
}

function closeModal(){
 $('modal').classList.remove('show');
}

function openMenu(){
 openModal('☰ Neon Snake Menü',`
 <div class="grid2">
 <button onclick="snakeShop()">🐍 Skins & Schlangen</button>
 <button onclick="snakeThemes()">🌌 Spielfeld</button>
 <button onclick="snakeModes()">🎮 Spielmodi</button>
 <button onclick="snakeMissions()">🏆 Missionen</button>
 <button onclick="snakeAchievements()">✨ Erfolge</button>
 <button onclick="snakeDaily()">🎁 Tagesbonus</button>
 <button onclick="snakeStats()">📊 Statistiken</button>
 </div>
 <p class="note">Münzen: <b>${coins}</b> · Rekord: <b>${best}</b></p>`);
}

window.snakeShop=function(){
 let h='<p class="note">Kaufe neue Schlangen-Skins mit Münzen. Deine bisherigen Skins bleiben erhalten.</p>';
 skins.forEach(s=>{
  const has=owned.includes(s.id);
  h+=`<div class="item"><div>🐍 <b>${s.name}</b><small>${s.cost===0?'Kostenlos':s.cost+' Münzen'}</small></div><button onclick="buySkin('${s.id}')">${selected===s.id?'Ausgewählt':has?'Auswählen':s.cost+' 🪙'}</button></div>`;
 });
 openModal('🐍 Skin-Shop',h);
};

window.buySkin=function(id){
 const s=skins.find(x=>x.id===id);
 if(!s)return;
 if(!owned.includes(id)){
  if(coins<s.cost){
   status('Nicht genug Münzen.');
   return;
  }
  coins-=s.cost;
  owned.push(id);
 }
 selected=id;

window.snakeThemes=function(){
 let h='<p class="note">Wähle ein Design für dein Spielfeld.</p>';
 themes.forEach(t=>{
  const has=ownedThemes.includes(t.id);
  h+=`<div class="item"><div>🌌 <b>${t.name}</b><small>${t.cost===0?'Kostenlos':t.cost+' Münzen'}</small></div><button onclick="buyTheme('${t.id}')">${theme===t.id?'Aktiv':has?'Auswählen':t.cost+' 🪙'}</button></div>`;
 });
 openModal('🌌 Spielfeld-Designs',h);
};

window.buyTheme=function(id){
 const t=themes.find(x=>x.id===id);
 if(!t)return;
 if(!ownedThemes.includes(id)){
  if(coins<t.cost){
   status('Nicht genug Münzen.');
   return;
  }
  coins-=t.cost;
  ownedThemes.push(id);
 }
 theme=id;
 persist();
 updateUI();
 snakeThemes();
 draw();
};
